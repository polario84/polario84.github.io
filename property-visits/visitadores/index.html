<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hazte visitador · Visita Inmueble</title><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:26px 16px 60px}.hero{background:#111;color:#fff;padding:26px;border-radius:18px;margin-bottom:18px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#ddd}.card{background:#fff;border:1px solid #e1e4e8;border-radius:16px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}label{display:block;font-weight:650;margin:11px 0 5px}input,textarea,select,button{font:inherit;width:100%;padding:11px 12px;border:1px solid #cbd0d6;border-radius:10px}textarea{min-height:90px}button{border:0;background:#111;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}.danger{background:#8b1e1e}.muted{color:#666;font-size:14px}.ok{padding:12px;border-radius:10px;background:#e9f7ec}.warn{padding:12px;border-radius:10px;background:#fff4d8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.row,.actions{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><section class="hero"><h1>🚗 Hazte visitador</h1><p>Realiza visitas visuales guiadas para inversores que no pueden desplazarse.</p></section>
<section id="register" class="card"><h2>Alta de visitador</h2><p class="muted">Completa tus datos. La cuenta queda pendiente de revisión antes de recibir encargos.</p><div class="row"><div><label>Nombre y apellidos</label><input id="name"></div><div><label>Email</label><input id="email" type="email"></div></div><div class="row"><div><label>Teléfono</label><input id="phone" type="tel"></div><div><label>Código postal</label><input id="postal_code"></div></div><div class="row"><div><label>Localidad</label><input id="city"></div><div><label>Provincia</label><input id="province"></div></div><div class="row"><div><label>Radio de desplazamiento</label><select id="radius_km"><option value="10">10 km</option><option value="25" selected>25 km</option><option value="50">50 km</option><option value="75">75 km</option><option value="100">100 km</option></select></div><div><label>¿Tienes vehículo?</label><select id="has_vehicle"><option value="false">No</option><option value="true">Sí</option></select></div></div><label>Disponibilidad habitual</label><textarea id="availability_text" placeholder="Ej.: tardes entre semana y sábados por la mañana"></textarea><label style="font-weight:500"><input id="terms" type="checkbox" style="width:auto;margin-right:8px">Declaro que soy mayor de edad y que, si soy aceptado, actuaré como colaborador independiente siguiendo el protocolo de observación visual de la plataforma.</label><button id="submit">Enviar solicitud</button><div id="registerMsg" class="hidden"></div></section>
<section id="review" class="card hidden"><h2>Revisión de visitador</h2><div id="reviewBody"></div><div id="reviewActions" class="actions"><button id="approve">Aprobar y activar</button><button id="reject" class="danger">Rechazar</button></div><div id="reviewMsg" class="hidden"></div></section></div><script>
const API='https://opshdxamvvdkdjetxfgc.supabase.co/functions/v1/property-visits-mvp';const p=new URLSearchParams(location.search),role=p.get('role'),token=p.get('token');const $=x=>document.getElementById(x);function show(x){$(x).classList.remove('hidden')}function hide(x){$(x).classList.add('hidden')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(action,opts={}){const r=await fetch(API+'?action='+action,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error(t||('HTTP '+r.status))}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
if(role==='reviewer'&&token){hide('register');show('review');loadReview()}
$('submit').onclick=async()=>{const b={name:$('name').value,email:$('email').value,phone:$('phone').value,postal_code:$('postal_code').value,city:$('city').value,province:$('province').value,radius_km:Number($('radius_km').value),has_vehicle:$('has_vehicle').value==='true',availability_text:$('availability_text').value,terms_accepted:$('terms').checked};try{$('submit').disabled=true;const d=await api('api_register_visitor',{method:'POST',body:JSON.stringify(b)});$('registerMsg').className='ok';$('registerMsg').innerHTML='<strong>Solicitud enviada.</strong><br>Estado: '+esc(d.status)+'. Te avisaremos cuando esté revisada.';show('registerMsg')}catch(e){$('registerMsg').className='warn';$('registerMsg').textContent='Error: '+e.message;show('registerMsg')}finally{$('submit').disabled=false}};
async function loadReview(){try{const d=await api('api_review_visitor_status&token='+encodeURIComponent(token));$('reviewBody').innerHTML='<p><strong>'+esc(d.name)+'</strong></p><p>'+esc(d.email)+' · '+esc(d.phone||'Sin teléfono')+'</p><p>'+esc(d.city)+', '+esc(d.province||'')+' · CP '+esc(d.postal_code||'')+'</p><p>Radio: '+esc(d.radius_km)+' km · Vehículo: '+(d.has_vehicle?'Sí':'No')+'</p><p>Disponibilidad: '+esc(d.availability_text||'No indicada')+'</p><p>Estado actual: <strong>'+esc(d.approval_status)+'</strong></p>';if(d.approval_status!=='PENDING')hide('reviewActions')}catch(e){$('reviewBody').textContent='Error: '+e.message;hide('reviewActions')}}
async function review(action){try{const d=await api('api_review_visitor_action',{method:'POST',body:JSON.stringify({token,action})});$('reviewMsg').className='ok';$('reviewMsg').textContent='Estado: '+d.state;show('reviewMsg');hide('reviewActions');await loadReview()}catch(e){$('reviewMsg').className='warn';$('reviewMsg').textContent='Error: '+e.message;show('reviewMsg')}}$('approve').onclick=()=>review('APPROVE');$('reject').onclick=()=>review('REJECT');
</script></body></html>

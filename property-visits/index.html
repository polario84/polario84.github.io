<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visita Inmueble · MVP</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px}.hero{background:#111;color:white;padding:28px;border-radius:18px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#d6d6d6}.card{background:#fff;border:1px solid #e3e5e8;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.03)}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,button{font:inherit;width:100%;padding:11px 12px;border:1px solid #cfd3d8;border-radius:10px}textarea{min-height:90px;resize:vertical}button{margin-top:14px;background:#111;color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#eceff2;color:#111}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#666;font-size:14px}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2f6;font-weight:700}.ok{background:#e8f7ec}.warn{background:#fff4d8}.hidden{display:none}.check{border-top:1px solid #eee;padding-top:14px;margin-top:14px}.check:first-child{border-top:0;padding-top:0}.evidence{font-size:13px;color:#555;margin-top:5px}.report h2{margin-top:24px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.smallbtn{width:auto;padding:9px 12px;margin:0}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#111;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:650px){.row{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero"><h1>🏠 Visita Inmueble · MVP</h1><p>Una visita visual guiada para inversores que no pueden desplazarse.</p></section>

  <section id="stepCreate" class="card">
    <h2>1. Crear encargo</h2>
    <p class="muted">Piloto técnico sin pagos. Introduce un inmueble de prueba.</p>
    <div class="row"><div><label>Nombre</label><input id="client_name" value="Cliente Demo"></div><div><label>Email</label><input id="client_email" type="email" placeholder="tu@email.com"></div></div>
    <label>Enlace del anuncio</label><input id="listing_url" value="https://example.com/inmueble">
    <label>Dirección</label><input id="address" value="Calle Mayor 1">
    <div class="row"><div><label>Ciudad</label><input id="city" value="El Molar"></div><div><label>Provincia</label><input id="province" value="Madrid"></div></div>
    <label>Código postal</label><input id="postal_code" value="28710">
    <label>Preguntas del inversor</label><textarea id="client_questions">¿Hay ruido? ¿Se ven humedades?</textarea>
    <button id="createBtn">Crear encargo</button>
  </section>

  <section id="stepJob" class="card hidden">
    <div class="topline"><div><h2 style="margin:0">2. Encargo</h2><p class="muted" id="jobId"></p></div><span id="jobStatus" class="status"></span></div>
    <div id="jobInfo"></div>
    <button id="acceptBtn">Aceptar como visitador de prueba</button>
  </section>

  <section id="stepChecklist" class="card hidden">
    <h2>3. Checklist de visita</h2>
    <p class="muted">Completa las observaciones. Puedes adjuntar foto o vídeo en cada punto.</p>
    <div id="checklist"></div>
    <button id="submitBtn">Finalizar visita y generar informe</button>
  </section>

  <section id="stepReport" class="card hidden report">
    <h2>4. Informe</h2>
    <div id="reportBody"></div>
  </section>

  <section id="msg" class="card hidden"></section>
</div>
<script>
const API='https://opshdxamvvdkdjetxfgc.supabase.co/functions/v1/property-visits-mvp';
let token=null, items=[];
const $=id=>document.getElementById(id);
function show(id){$(id).classList.remove('hidden')} function hide(id){$(id).classList.add('hidden')}
function msg(text,type='warn'){show('msg');$('msg').className='card '+type;$('msg').innerHTML=text}
async function api(action,opts={}){const sep=action.includes('?')?'&':'?';const r=await fetch(API+'?action='+action,{...opts,headers:opts.body instanceof FormData?opts.headers:{'Content-Type':'application/json',...(opts.headers||{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error(t||('HTTP '+r.status))}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}

$('createBtn').onclick=async()=>{try{$('createBtn').disabled=true;$('createBtn').innerHTML='<span class="spinner"></span>Creando…';const d=await api('api_create',{method:'POST',body:JSON.stringify({client_name:$('client_name').value,client_email:$('client_email').value,listing_url:$('listing_url').value,address:$('address').value,city:$('city').value,province:$('province').value,postal_code:$('postal_code').value,client_questions:$('client_questions').value})});token=d.public_token;show('stepJob');$('jobId').textContent='ID: '+d.job_id;$('jobStatus').textContent=d.status||'CREADO';$('jobInfo').innerHTML='<p>Visitador asignado automáticamente: <strong>'+(d.visitor_id?'sí':'no')+'</strong></p>';$('stepJob').scrollIntoView({behavior:'smooth'});hide('msg')}catch(e){msg('<strong>Error:</strong> '+e.message)}finally{$('createBtn').disabled=false;$('createBtn').textContent='Crear encargo'}};

$('acceptBtn').onclick=async()=>{try{$('acceptBtn').disabled=true;$('acceptBtn').innerHTML='<span class="spinner"></span>Aceptando…';const d=await api('api_accept',{method:'POST',body:JSON.stringify({token})});if(!d.accepted)throw new Error('El encargo no se pudo aceptar');$('jobStatus').textContent='ACEPTADO';$('jobStatus').className='status ok';$('acceptBtn').classList.add('hidden');await loadChecklist();show('stepChecklist');$('stepChecklist').scrollIntoView({behavior:'smooth'});hide('msg')}catch(e){msg('<strong>Error:</strong> '+e.message)}finally{$('acceptBtn').disabled=false;$('acceptBtn').textContent='Aceptar como visitador de prueba'}};

async function loadChecklist(){items=await api('api_checklist&token='+encodeURIComponent(token));$('checklist').innerHTML=items.map((x,i)=>`<div class="check" data-i="${i}"><strong>${i+1}. ${esc(x.category)}</strong><p>${esc(x.instruction)}</p><label>Respuesta</label><input class="resp" value="${esc(x.response||'OK')}"><label>Notas</label><textarea class="notes">${esc(x.notes||'')}</textarea><label>Foto o vídeo</label><input class="file" type="file" accept="image/*,video/mp4,video/quicktime"><div class="evidence"></div></div>`).join('');document.querySelectorAll('.file').forEach((el,i)=>el.onchange=()=>upload(i,el));}

async function upload(i,input){const file=input.files[0];if(!file)return;const box=input.closest('.check').querySelector('.evidence');box.innerHTML='<span class="spinner"></span>Subiendo '+esc(file.name)+'…';try{const f=new FormData();f.append('token',token);f.append('code',items[i].code);f.append('file',file);const d=await api('api_upload',{method:'POST',body:f});items[i]._evidence=d.path;box.textContent='✅ Evidencia subida';}catch(e){box.textContent='❌ '+e.message;}}

$('submitBtn').onclick=async()=>{try{$('submitBtn').disabled=true;$('submitBtn').innerHTML='<span class="spinner"></span>Generando informe con IA…';const nodes=[...document.querySelectorAll('.check')];const payload=items.map((x,i)=>({code:x.code,response:nodes[i].querySelector('.resp').value,notes:nodes[i].querySelector('.notes').value,evidence_url:x._evidence||x.evidence_url||''}));const d=await api('api_submit',{method:'POST',body:JSON.stringify({token,items:payload})});if(d.state!=='READY_FOR_REPORT')throw new Error('Faltan elementos obligatorios: '+d.state);if(!d.ai?.ok)throw new Error('Checklist guardado, pero el informe IA falló: '+(d.ai?.error||'error desconocido'));await loadReport();$('jobStatus').textContent='INFORME GENERADO';$('stepReport').scrollIntoView({behavior:'smooth'});hide('msg')}catch(e){msg('<strong>Error:</strong> '+e.message)}finally{$('submitBtn').disabled=false;$('submitBtn').textContent='Finalizar visita y generar informe'}};

async function loadReport(){const d=await api('api_report&token='+encodeURIComponent(token));$('reportBody').innerHTML=d.report_html||'<p>Informe sin contenido.</p>';show('stepReport')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
